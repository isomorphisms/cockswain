name: Cockswain v1

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Build unresolved-work queue
        env:
          GH_TOKEN: ${{ github.token }}
          COCKSWAIN_OWNER: isomorphisms
        run: |
          mkdir -p "$RUNNER_TEMP/cockswain"
          sh bin/cockswain-v1 "$RUNNER_TEMP/cockswain/queue.md"
          cat "$RUNNER_TEMP/cockswain/queue.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish durable queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Cockswain v1 queue'
          queue="$RUNNER_TEMP/cockswain/queue.md"

          number=$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 100 \
              --json number,title \
              --jq '.[] | select(.title == "Cockswain v1 queue") | .number' |
              head -n 1
          )

          if [ -n "$number" ]; then
            gh issue edit "$number" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$queue"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body-file "$queue"
          fi
